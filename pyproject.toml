[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inference-bench"
version = "1.0.0"
description = "Reproducible AI Inference Optimization & Benchmarking Framework across models, precisions, and runtimes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0,<2.1.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "click>=8.1.0",
    "psutil>=5.9.0",
    "tabulate>=0.9.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
bench = "ai_inference_bench.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
